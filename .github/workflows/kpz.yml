on:
  workflow_dispatch:
  push:
    branches:
      - "vfgh"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  kpz:
    name: "Build a KPZ archive"
    runs-on: "ubuntu-latest"
    steps:
    - uses: actions/checkout@v4
    - name: Get the plugin metadata
      id: metadata
      run: |
        VERSION=$(perl -lne 'print $1 if /our \$VERSION = "(.*)"/' Koha/Plugin/HKS3/ISBD4MARCPunctuation.pm)
        echo "Plugin version: $VERSION"
        echo "plugin_version=$VERSION" >> $GITHUB_OUTPUT

        KPZ_VERSION="$VERSION"
        if [ "$GITHUB_REF_NAME" = "vfgh" ]; then
          KPZ_VERSION="${VERSION}-vfgh"
        fi
        echo "KPZ version label: $KPZ_VERSION"
        echo "kpz_version=$KPZ_VERSION" >> $GITHUB_OUTPUT

        MINIMUM_KOHA_VERSION=$(perl -lne 'print $1 if /minimum_version\s*=>\s*\D([\d\.]+)\D/' Koha/Plugin/HKS3/ISBD4MARCPunctuation.pm)
        echo "Minimum Koha version: $MINIMUM_KOHA_VERSION"
        echo "minimum_koha_version=$MINIMUM_KOHA_VERSION" >> $GITHUB_OUTPUT
    - name: Build Koha Plugin kpz artifact
      id: kpz
      uses: "bywatersolutions/github-action-koha-plugin-create-kpz@master"
      with:
        release-version: ${{ steps.metadata.outputs.kpz_version }}
        release-name: "Koha::Plugin::HKS3::ISBD4MARCPunctuation"
        minimum-version: ${{ steps.metadata.outputs.minimum_koha_version }}
        plugin-module: "Koha/Plugin/HKS3/ISBD4MARCPunctuation.pm"
    - name: Upload KPZ artifact (branch builds)
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      uses: actions/upload-artifact@v4
      with:
        name: isbd4marcpunctuation-kpz-${{ github.ref_name }}
        path: ${{ steps.kpz.outputs.filename }}
    - name: Release
      if: ${{ startsWith(github.ref, 'refs/tags/') }}
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ steps.kpz.outputs.filename }}
